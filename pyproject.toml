[project]
name = "tepidline"
version = "1.0.0"
description = "Finds where a building's water sits warm in its pipes long enough to matter, and plans the cheapest fixes"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Reihaneh Rahmati", email = "reihaneh26686@gmail.com" }]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tepidline = "tepidline.__main__:main"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I", "RUF", "PL", "S"]
ignore = ["B905", "PLR0917", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW2901", "S311", "S101", "RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLC0415"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["tests"]
